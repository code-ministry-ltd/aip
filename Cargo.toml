[workspace]
resolver = "2"
members = ["crates/aip-core", "crates/aip-cli", "crates/aip-app"]

[workspace.package]
version = "2.0.0-dev.0"
edition = "2021"
repository = "https://github.com/code-ministry-ltd/aip"
rust-version = "1.80"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2"
trash = "5"
tempfile = "3"
toml = "0.9"
toml_edit = "0.23"

[profile.release]
lto = true
codegen-units = 1
strip = true
